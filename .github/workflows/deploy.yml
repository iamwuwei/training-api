name: deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  id-token: write   # OIDC → AWS role
  contents: read

env:
  AWS_REGION: ap-northeast-1
  # non-secret config; secrets live in the `prod` environment
  DB_HOST: training.cluster-cvigvl3wbuuw.ap-northeast-1.rds.amazonaws.com
  DB_PORT: "5432"
  DB_NAME: postgres
  DB_USER: postgres
  CLAUDE_MODEL: claude-haiku-4-5
  AUTO_REVIEW: "true"
  CORS_ORIGIN: ${{ vars.CORS_ORIGIN || 'https://iamwuwei.github.io' }}

jobs:
  # Typecheck + synth with placeholders. No AWS, no secrets: runs on every PR.
  check:
    runs-on: ubuntu-latest
    env:
      DB_CLUSTER_RESOURCE_ID: cluster-placeholder
      STRAVA_CLIENT_ID: placeholder
      STRAVA_CLIENT_SECRET: placeholder
      STRAVA_VERIFY_TOKEN: placeholder
      ANTHROPIC_API_KEY: placeholder
      APPLE_CLIENT_ID: placeholder
      SESSION_SECRET: placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cdk synth --quiet

  # Real deploy on push to main, using the `prod` environment's secrets.
  deploy:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      DB_CLUSTER_RESOURCE_ID: ${{ secrets.DB_CLUSTER_RESOURCE_ID }}
      STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
      STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
      STRAVA_VERIFY_TOKEN: ${{ secrets.STRAVA_VERIFY_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Prints the OIDC claims AWS will see (sub / aud / iss). Compare `sub`
      # with the role's trust policy when AssumeRoleWithWebIdentity fails.
      - name: Show OIDC claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          python3 - "$TOKEN" <<'PY'
          import sys, json, base64
          seg = sys.argv[1].split(".")[1]; seg += "=" * (-len(seg) % 4)
          c = json.loads(base64.urlsafe_b64decode(seg))
          print(json.dumps({k: c.get(k) for k in ("iss", "aud", "sub", "repository", "ref", "environment")}, indent=2))
          PY
          echo "role arn length: ${#AWS_ROLE_ARN} (expected 59 for arn:aws:iam::016312762943:role/github-training-api-deploy)"
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy
        run: npx cdk deploy --require-approval never --outputs-file cdk-outputs.json
      - name: Function URLs
        run: cat cdk-outputs.json
